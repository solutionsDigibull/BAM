[project]
name = "sbam-identity-spike"
version = "0.0.0"
description = "Spike E0.13 (#31): FastAPI JWT validation against Keycloak JWKS. Throwaway; #48 ports it."
requires-python = "==3.12.*"
dependencies = ["fastapi>=0.142.2", "uvicorn>=0.54.0", "pyjwt[crypto]>=2.15.1"]

[dependency-groups]
dev = ["pytest>=8.4", "httpx2>=2.13.1", "ruff>=0.13", "black>=25.1", "mypy>=1.18"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"] }

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["auth.py", "app.py", "tests"]
