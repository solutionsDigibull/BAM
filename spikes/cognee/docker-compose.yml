# Spike E0.9 (#26): Cognee -> Bifrost -> OpenRouter, isolated from the product stack.
# Not part of compose/compose.yaml (owned by #39). Run from this directory.
#
# Network design (proves T06, gateway-only egress):
#   spike_internal  (internal: true, no route to the internet)  runner + bifrost
#   spike_egress    (normal bridge)                             bifrost only
# The runner therefore cannot reach openrouter.ai even if misconfigured; only Bifrost can.

name: sbam-spike-cognee

services:
  bifrost:
    image: maximhq/bifrost:v2.2.6
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in spikes/cognee/.env}
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:?set BIFROST_ENCRYPTION_KEY in spikes/cognee/.env}
    volumes:
      - ./bifrost/config.json:/app/data/config.json:ro
      - bifrost_data:/app/data/db
    networks:
      - spike_internal
      - spike_egress
    ports:
      - "127.0.0.1:18080:8080" # host access for debugging only (8080 is often taken locally)

  runner:
    build: .
    depends_on:
      - bifrost
    # No env_file here on purpose: it would copy OPENROUTER_API_KEY and BIFROST_ENCRYPTION_KEY into this container.
    # Variables are interpolated from .env one by one, so Cognee only receives what it needs.
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-.}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-.}
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL in spikes/cognee/.env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL in spikes/cognee/.env}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-8191}
      # Cognee talks to Bifrost only. It never receives the OpenRouter key.
      LLM_PROVIDER: custom
      LLM_ENDPOINT: http://bifrost:8080/v1
      EMBEDDING_PROVIDER: openai_compatible
      EMBEDDING_ENDPOINT: http://bifrost:8080/v1
      ENABLE_BACKEND_ACCESS_CONTROL: "true"
      DATA_ROOT_DIRECTORY: /data/cognee/data
      SYSTEM_ROOT_DIRECTORY: /data/cognee/system
    volumes:
      - cognee_data:/data/cognee
      - ./src:/spike/src:ro
      - ./fixtures:/spike/fixtures # generated by spike.gen_fixtures (synthetic)
      - ../../docs/reference:/spike/reference:ro # masters workbook (MSC), read-only
      - ./out:/spike/out
    networks:
      - spike_internal
    command: ["sleep", "infinity"]

networks:
  spike_internal:
    internal: true
  spike_egress: {}

volumes:
  bifrost_data: {}
  cognee_data: {}
