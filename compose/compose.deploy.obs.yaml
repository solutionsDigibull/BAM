# Deployed `obs` profile (E16.3, #142, TD §20.5): load AFTER compose.obs.yaml, with compose.deploy.yaml:
#   -f compose.yaml -f compose.deploy.yaml -f compose.obs.yaml -f compose.deploy.obs.yaml -f compose.<env>.yaml
# Grafana and Langfuse are ops UIs: reachable over Netbird only, never through the proxy. This file moves their
# ports from loopback to the VM's Netbird address (${SBAM_OPS_BIND}) and stops publishing the OTLP ports
# (telemetry stays inside the Compose network).
# Known gap, owned by #140/#141: compose.obs.yaml still passes its secrets as inline environment values and
# runs minio from a :latest tag pinned by digest. scripts/compose_lint.py reports both as warnings for obs
# until those issues move them to Docker secrets; the core stack has no such warnings.
services:
  otel-collector:
    ports: !override
      - ${SBAM_OPS_BIND:?set the VM Netbird address}:${GRAFANA_PORT:-3002}:3000
  langfuse-web:
    ports: !override
      - ${SBAM_OPS_BIND:?set the VM Netbird address}:${LANGFUSE_PORT:-3001}:3000
  # LLM traces (E16.2, TD §17.2): the workers that call the gateway send to this environment's Langfuse
  # project over the internal network; its key pair is a Docker secret per VM (with-secrets.sh turns
  # *_FILE into the variable, over the empty value of compose.yaml). Without them a staging or prod
  # worker refuses to start (sbam_workers.llm.preflight).
  worker-ingest: &langfuse-worker
    environment:
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY_FILE: /run/secrets/langfuse_public_key
      LANGFUSE_SECRET_KEY_FILE: /run/secrets/langfuse_secret_key
    secrets:
      - { source: langfuse_public_key, target: langfuse_public_key, uid: "10001", gid: "10001", mode: 0400 }
      - { source: langfuse_secret_key, target: langfuse_secret_key, uid: "10001", gid: "10001", mode: 0400 }
  worker-llm: *langfuse-worker
  worker-build: *langfuse-worker
  worker-test: *langfuse-worker

secrets:
  langfuse_public_key: { file: "${SBAM_SECRETS_DIR:-/etc/sbam/secrets}/langfuse_public_key" }
  langfuse_secret_key: { file: "${SBAM_SECRETS_DIR:-/etc/sbam/secrets}/langfuse_secret_key" }
