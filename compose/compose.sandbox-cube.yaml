# Points `worker-test` at a CubeSandbox host that Docker Desktop can reach, for example the WSL2 development host
# (WG-1, #749, docs/runbooks/sandbox-host.md). Load it after the core files:
#   docker compose -f compose.yaml -f compose.override.yaml -f compose.sandbox-cube.yaml -p sbam up -d worker-test
#
# A DEVELOPMENT override, not a production one: production reaches the host over Netbird and sets the same CUBE_*
# variables. Nothing here is a secret. Override any value from your shell or compose/.env.
#
# Values in compose/.env win over the defaults below, and shell variables win over compose/.env. To use the WSL2
# development host while compose/.env points at another host, set all three from the shell (the port too: a stale
# CUBE_PROXY_PORT_HTTP sends the data plane to the wrong port and every run ends HOST_UNREACHABLE):
#   CUBE_API_URL=http://host.docker.internal:13000 CUBE_PROXY_NODE_IP=host.docker.internal CUBE_PROXY_PORT_HTTP=80 \
#     docker compose -f compose.yaml -f compose.override.yaml -f compose.sandbox-cube.yaml -p sbam up -d worker-test
#
# Honest limits of this override:
#  - the egress evidence file is an EMPTY placeholder, because the collector does not exist yet (WG-14). A run on this
#    host is real and isolated, but it has no egress evidence, so treat its results as development evidence only;
#  - the mock API runs on the internal network, which a microVM on the host cannot reach, so cases that call a mocked
#    outside service cannot run here until WG-14/WG-17 give the VM a route to it.
services:
  worker-test:
    # The core worker sits only on sbam_internal, which has no route out. The sandbox host is outside the stack.
    networks: [sbam_internal, sbam_edge]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./sandbox-cube/egress.dev.jsonl:/egress/egress.jsonl:ro
    environment:
      SANDBOX_MODE: ${SANDBOX_MODE:-CUBESANDBOX}
      CUBE_API_URL: ${CUBE_API_URL:-http://host.docker.internal:13000}
      CUBE_PROXY_NODE_IP: ${CUBE_PROXY_NODE_IP:-host.docker.internal}
      SANDBOX_EGRESS_LOG_PATH: ${SANDBOX_EGRESS_LOG_PATH:-/egress/egress.jsonl}
