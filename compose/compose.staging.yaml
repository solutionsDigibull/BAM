# Staging VM overrides (E16.3, #142): load after compose.yaml and compose.deploy.yaml (docs/runbooks/environments.md).
# This file changes only sizing, the environment flag and the LLM provider. It never changes an image.
# Staging runs the real LLM path: SBAM_ENV=staging, LLM_PROVIDER=bifrost (the API refuses to boot with the mock
# there, E1.15-T09) and the mock upstream is not part of the stack. The proxy binds to the VM's Netbird address:
# staging is not public.

x-worker: &worker { cpus: 1.0, mem_limit: 1g }

x-worker-real: &worker-real
  cpus: 1.0
  mem_limit: 1g
  environment: { LLM_PROVIDER: bifrost, SBAM_ENV: staging } # stubs refuse to run outside dev (A-01)

services:
  postgres:
    cpus: 2.0
    mem_limit: 2g
  keycloak:
    cpus: 1.0
    mem_limit: 1536m
  temporal:
    cpus: 1.0
    mem_limit: 1536m
  temporal-ui:
    cpus: 0.5
    mem_limit: 256m
  bifrost:
    cpus: 1.0
    mem_limit: 512m
    # The mock upstream is off in this environment, so bifrost no longer waits for it.
    depends_on: !reset null
    volumes:
      - ./bifrost/config.bifrost.json:/app/data/config.json:ro
  clamav:
    cpus: 1.0
    mem_limit: 3g
  tusd:
    cpus: 0.5
    mem_limit: 256m
  sbam-api:
    cpus: 1.0
    mem_limit: 1536m
    environment:
      SBAM_ENV: staging
      LLM_PROVIDER: bifrost
  sbam-web:
    cpus: 1.0
    mem_limit: 768m
  sbam-mock-api:
    cpus: 0.25
    mem_limit: 128m
  proxy:
    cpus: 0.5
    mem_limit: 256m
  worker-ingest: *worker-real
  worker-knowledge: *worker-real
  worker-llm: *worker-real
  worker-build: *worker-real
  worker-test: *worker-real
  worker-certify: *worker-real
  sbam-llm-mock:
    profiles: [mock-llm] # never started here; staging and prod use the real provider
