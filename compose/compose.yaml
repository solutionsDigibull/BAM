# SBAM Docker Compose: the `core` profile (TD §20.3). Every service here is core and always starts.
# Run through the Makefile (`make up`), which loads compose/.env and compose.override.yaml.
# Services whose feature isn't built yet are stubs with their final name, port and healthcheck
# (TD §20.3.6); the owning issue replaces only its own block.
name: sbam


x-worker: &worker
  image: sbam-worker:local
  build:
    context: ..
    dockerfile: compose/docker/server.Dockerfile
    target: prod
    args: { PACKAGE: sbam-workers, ROLE: worker }
  # Temporal worker (#40): `python -m sbam_workers.bootstrap --queues $SBAM_QUEUES`. Variables are passed
  # one by one, never an env_file (the OpenRouter key must not reach workers, ADR 0001).
  environment: &worker-env
    SBAM_QUEUES: unset
    LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    TEMPORAL_HOST: temporal:7233
    TEMPORAL_NAMESPACE: sbam
    DATABASE_URL: postgresql://sbam:${SBAM_DB_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}@postgres:5432/sbam
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Product analytics (E16.2): workers dispatch the outbox, so they send the PostHog events. Empty
    # host or key = no events (the default; the `analytics` profile is still a stub, #142).
    SBAM_ENV: ${SBAM_ENV:-development}
    POSTHOG_HOST: ${POSTHOG_HOST:-}
    POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
    POSTHOG_DISTINCT_ID_SALT: ${POSTHOG_DISTINCT_ID_SALT:-}
    # LLM traces (E16.2): the environment's Langfuse project. Empty = no traces; staging/prod workers
    # refuse to start without them (sbam_workers.llm.preflight).
    LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    LANGFUSE_LOG_CONTENT: ${LANGFUSE_LOG_CONTENT:-false}
    # LLM cost control (#420, ADR 0015): the derivative cache, and the opt-in budgets. Empty = no limit.
    # The price table is JSON per alias in USD per million tokens, used when Bifrost reports no cost.
    LLM_DERIVATIVE_CACHE: ${LLM_DERIVATIVE_CACHE:-true}
    LLM_PROJECT_BUDGET_USD: ${LLM_PROJECT_BUDGET_USD:-}
    LLM_TENANT_BUDGET_USD: ${LLM_TENANT_BUDGET_USD:-}
    LLM_PRICE_USD_PER_MTOK: ${LLM_PRICE_USD_PER_MTOK:-}
  depends_on: &worker-depends
    api-migrate: { condition: service_completed_successfully } # temporal_runs (run mirror)
    postgres: { condition: service_healthy }
    temporal: { condition: service_healthy }
    temporal-namespace: { condition: service_completed_successfully }
    bifrost: { condition: service_healthy }
  networks: [sbam_internal] # no internet route (TD §20.3.3)
  cpus: 1.0 # ponytail: default limits, the TD sets none; tune when real workers land (#40)
  mem_limit: 1g
  restart: unless-stopped

services:
  # --- data -------------------------------------------------------------------------------------
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
      SBAM_DB_PASSWORD: ${SBAM_DB_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    networks: [sbam_edge, sbam_internal]
    healthcheck:
      # Over TCP: on a fresh volume the init scripts run on a socket-only temporary server, which a
      # socket pg_isready reports as ready while TCP clients (temporal-schema) still get refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  schema-check:
    # SCHEMA_SQL gate (E9.4, TD §12.6): a scratch PostgreSQL 16 the build worker applies each Workflow's
    # schema.sql to, in a throwaway database it drops afterwards. Holds no SBAM data, keeps nothing
    # (tmpfs), has no published port and is on its own internal network with worker-build only, so it
    # uses trust auth: there is no secret to manage and nothing to protect but its own scratch databases.
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs: [/var/lib/postgresql/data]
    networks: [sbam_schema_check]
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage-init:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command:
      - sh
      - -c
      - mkdir -p /data/storage/uploads /data/storage/derived /data/storage/okf /data/storage/code /data/storage/tests /data/storage/exports && chown -R 10001:10001 /data/storage
    volumes: [storage:/data/storage]
    network_mode: none

  # --- identity ---------------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
      KC_HEALTH_ENABLED: "true"
      # Browsers use localhost:<port>; containers reach keycloak:8080. Tokens carry the localhost issuer
      # (see ADR 0002); #47/#48 align the API's expected issuer with it.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Placeholders in the realm file (seed user password, web port for redirect URIs).
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
      WEB_PORT: ${WEB_PORT:-3000}
    volumes:
      # Hardened realm (#47): clients, roles, mappers, token policy; no users. --import-realm skips a
      # realm that already exists. Local seed users come from keycloak-seed (compose.override.yaml).
      - ./keycloak/realm-bullm.json:/opt/keycloak/data/import/realm-bullm.json:ro
    ports: ["127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"]
    networks: [sbam_edge, sbam_internal]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # --- workflow engine --------------------------------------------------------------------------
  temporal-schema:
    image: temporalio/admin-tools:1.31.3@sha256:76a70ead160808b54acdbc98944dfc07990d9637dda999118a2d9ee1f58b9bc9
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: "5432"
      SQL_USER: temporal
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
    # setup-schema -v 0.0 and update-schema are both re-runnable (TD §20.3.4).
    entrypoint:
      - sh
      - -ec
      - |
        schema=/etc/temporal/schema/postgresql/v12
        temporal-sql-tool --db temporal setup-schema -v 0.0
        temporal-sql-tool --db temporal update-schema -d $$schema/temporal/versioned
        temporal-sql-tool --db temporal_visibility setup-schema -v 0.0
        temporal-sql-tool --db temporal_visibility update-schema -d $$schema/visibility/versioned
    networks: [sbam_internal]
    depends_on:
      postgres: { condition: service_healthy }

  temporal:
    image: temporalio/server:1.31.3@sha256:b4a78d2186e558aa3502be08d576086c3a82fccdf6184cb4c819eb27bea7bd63
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports: ["127.0.0.1:${TEMPORAL_PORT:-7233}:7233"]
    networks: [sbam_edge, sbam_internal]
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    healthcheck:
      # The server image has no `temporal` CLI (only admin-tools does), so check the frontend port;
      # temporal-namespace then talks to it with the real CLI.
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  temporal-namespace:
    image: temporalio/admin-tools:1.31.3@sha256:76a70ead160808b54acdbc98944dfc07990d9637dda999118a2d9ee1f58b9bc9
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint:
      - sh
      - -ec
      - |
        temporal operator namespace describe -n sbam >/dev/null 2>&1 || temporal operator namespace create -n sbam --retention 7d
        # Search attributes for the Temporal UI / visibility queries (TD §13.1, #40). Idempotent.
        for name in TenantId ProjectId SbamWorkflowId SkillId SbamStage; do
          temporal operator search-attribute list -n sbam | grep -qw "$$name" ||
            temporal operator search-attribute create -n sbam --name "$$name" --type Keyword
        done
    networks: [sbam_internal]
    depends_on:
      temporal: { condition: service_healthy }

  temporal-ui:
    image: temporalio/ui:2.55.0@sha256:3899d5cf749b5555c9f798d46f2423b1d6190ea391ca713db5d1bba961759e58
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: sbam
    ports: ["127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"]
    networks: [sbam_edge, sbam_internal]
    depends_on:
      temporal: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # --- LLM gateway, malware scanning, uploads ------------------------------------------------------
  bifrost:
    # The six sbam-* aliases (E1.15). The config is generated from bifrost/aliases.json: LLM_PROVIDER=mock
    # (default) routes to sbam-llm-mock, LLM_PROVIDER=bifrost to the real OpenRouter models. The OpenRouter key is
    # passed to bifrost only, never to api or workers (ADR 0001).
    image: maximhq/bifrost:v2.2.6@sha256:d0b4708ace1aa175766f94afa715fd9bba3a1b56c1dc2afff15a21edf3ae4e2a
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./bifrost/config.${LLM_PROVIDER:-mock}.json:/app/data/config.json:ro
    ports: ["127.0.0.1:${BIFROST_PORT:-8081}:8080"]
    depends_on:
      sbam-llm-mock: { condition: service_healthy }
    networks: [sbam_edge, sbam_internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sbam-llm-mock:
    # Deterministic OpenAI-compatible upstream for bifrost when LLM_PROVIDER=mock (E1.15). No secrets and no
    # internet route. It refuses to start with LLM_PROVIDER=mock when SBAM_ENV is staging or production.
    image: sbam-llm-mock:local
    build:
      context: ..
      dockerfile: compose/docker/llm-mock.Dockerfile
    environment:
      ENV: ${SBAM_ENV:-development}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      - ../server/tests/llm-mock:/fixtures:ro
    networks: [sbam_internal]
    restart: unless-stopped

  clamav:
    # Real clamd + freshclam; worker-ingest scans every upload through it (#62). Not published.
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    volumes: [clamav_db:/var/lib/clamav]
    networks: [sbam_edge, sbam_internal] # edge only for signature updates
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s # the first freshclam download takes minutes
    restart: unless-stopped

  tusd:
    # Uploads (#61): file store on the storage volume; the hooks in compose/tusd/hooks call the API
    # (pre-create checks token, size, count and type; post-finish registers the document version).
    # Downloads and termination are off: nothing reads an uploaded file before the scan (E4.3).
    image: tusproject/tusd:v2.10.1@sha256:7b1c552a8b42f4b36cb01f2a3bd49f82ab078b2eefd191459e716141dd50376c
    command:
      - -upload-dir=/data/storage/uploads
      - -base-path=/files/
      - -port=1080
      - -behind-proxy
      - -hooks-dir=/srv/tusdhooks
      - -hooks-enabled-events=pre-create,post-finish
      - -max-size=15728640
      - -disable-download
      - -disable-termination
      # Only the portal may call tusd cross-origin (A-33; tusd reflects any Origin by default). Behind
      # the proxy the portal and /files/ share an origin, so a deployed stack needs no CORS at all.
      - -cors-allow-origin=${TUSD_CORS_ORIGIN:-^http://localhost:${WEB_PORT:-3000}\z}
    user: "10001:10001"
    environment:
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET:?is required - set it in compose/.env (copy compose/.env.example)}
    volumes:
      - storage:/data/storage
      - ./tusd/hooks:/srv/tusdhooks:ro
    ports: ["127.0.0.1:${TUSD_PORT:-1080}:1080"]
    networks: [sbam_edge, sbam_internal]
    depends_on:
      storage-init: { condition: service_completed_successfully }
      sbam-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --method=OPTIONS http://127.0.0.1:1080/files/ 2>/dev/null || wget -q -S -O /dev/null http://127.0.0.1:1080/files/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # --- SBAM -------------------------------------------------------------------------------------
  api-migrate:
    # `sbam-migrate` = `alembic upgrade head` (#36); re-runnable, sbam-api waits for it.
    image: sbam-api:local
    build: &api-build
      context: ..
      dockerfile: compose/docker/server.Dockerfile
      target: prod
      args: { PACKAGE: sbam-api, ROLE: api }
    command: ["sbam-migrate"]
    environment:
      DATABASE_URL: postgresql://sbam:${SBAM_DB_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}@postgres:5432/sbam
    networks: [sbam_internal]
    depends_on:
      postgres: { condition: service_healthy }

  sbam-api:
    image: sbam-api:local
    build: *api-build
    environment:
      DATABASE_URL: postgresql://sbam:${SBAM_DB_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}@postgres:5432/sbam
      STORAGE_ROOT: /data/storage
      # Startup guard (E1.15-T09): the API refuses LLM_PROVIDER=mock when SBAM_ENV is staging/production.
      SBAM_ENV: ${SBAM_ENV:-development}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      # Signs download URLs (#37). Empty = signed downloads answer 503; existing stacks keep starting.
      STORAGE_SIGNING_KEY: ${STORAGE_SIGNING_KEY:-}
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: sbam
      ENABLE_PING: ${ENABLE_PING:-true} # sample command POST …/runs/ping (#40); local stack only
      # Tokens carry the browser-facing issuer (KC_HOSTNAME); keys are fetched inside the network (#48).
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/bullm
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/bullm/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: sbam-api
      # Tenant creation (#49): the sbam-api-admin service account manages organizations. Empty = 503.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/bullm
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      # Uploads (#61): tusd's hook secret (also signs upload tokens) and the URL the browser uploads to.
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET:?is required - set it in compose/.env (copy compose/.env.example)}
      # Upload tokens are signed with their own key (A-14). Empty = dev falls back to the hook secret.
      UPLOAD_TOKEN_KEY: ${UPLOAD_TOKEN_KEY:-}
      TUSD_PUBLIC_URL: ${TUSD_PUBLIC_URL:-http://localhost:${TUSD_PORT:-1080}/files/}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-10485760}
      # The masters workbook import (#56) scans uploads with clamd; down = the import answers 503.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: [storage:/data/storage]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    networks: [sbam_edge, sbam_internal]
    depends_on:
      api-migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      temporal: { condition: service_healthy }
      temporal-namespace: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    healthcheck:
      # Ready = db, storage, temporal and Keycloak JWKS all ok (the image itself checks /health/live).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  worker-ingest:
    <<: *worker
    # The parse cap of E4.5 (PARSE_MEMORY_LIMIT_BYTES): a 15 MB workbook or PDF is read in this worker.
    mem_limit: 1g
    environment:
      <<: *worker-env
      SBAM_QUEUES: sbam-ingest
      # Scan (#62): the stored upload is streamed to clamd, which is on the internal network only.
      # Purge (#75): the daily PurgeDeleted job removes the files of documents deleted 90+ days ago.
      STORAGE_ROOT: /data/storage
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_MAX_SIGNATURE_AGE_HOURS: ${CLAMAV_MAX_SIGNATURE_AGE_HOURS:-48}
    volumes: [storage:/data/storage] # only this worker writes/removes stored files
    depends_on:
      <<: *worker-depends
      clamav: { condition: service_healthy }
  worker-knowledge:
    # Cognee 1.6.2 runs as a library in this worker (#78, ADR 0001). Its stores live on cognee_data; its
    # LLM and embedding calls go to Bifrost only. The worker refuses to start (health FAILED) when access
    # control is off or any of these is missing (E5.1-T04). No OpenRouter key, no internet route.
    <<: *worker
    environment:
      <<: *worker-env
      SBAM_QUEUES: sbam-knowledge
      STORAGE_ROOT: /data/storage # reads parsed documents; writes masters.jsonl and the OKF bundle (#371)
      ENABLE_BACKEND_ACCESS_CONTROL: "true"
      DATA_ROOT_DIRECTORY: /data/cognee/data
      SYSTEM_ROOT_DIRECTORY: /data/cognee/system
      # LLM_PROVIDER stays SBAM's mock/bifrost switch; the backend sets Cognee's provider to "custom".
      LLM_ENDPOINT: http://bifrost:8080/v1
      LLM_MODEL: ${COGNEE_LLM_MODEL:-openai/sbam-knowledge} # openai/ = OpenAI-compatible, for LiteLLM
      LLM_API_KEY: ${COGNEE_BIFROST_KEY:-sbam-local}
      EMBEDDING_PROVIDER: openai_compatible
      EMBEDDING_ENDPOINT: http://bifrost:8080/v1
      EMBEDDING_MODEL: ${COGNEE_EMBEDDING_MODEL:-openai/sbam-embed}
      EMBEDDING_API_KEY: ${COGNEE_BIFROST_KEY:-sbam-local}
      EMBEDDING_DIMENSIONS: ${COGNEE_EMBEDDING_DIMENSIONS:-1536}
      COGNEE_USER_SECRET: ${COGNEE_USER_SECRET:-} # no built-in default (A-09); deployed envs read the secret file
      # No internet: never try HuggingFace for a tokenizer and send no telemetry; tiktoken's encoding and the
      # graph store's JSON extension are baked into the image (#259).
      HF_HUB_OFFLINE: "1"
      TELEMETRY_DISABLED: "1"
    volumes:
      - cognee_data:/data/cognee
      - storage:/data/storage # read-write: the build exports masters.jsonl and stores the OKF bundle (#371)
    mem_limit: 2g # Cognee + LanceDB; 1g is not enough for cognify
  worker-llm:
    <<: *worker
    # SOW generation reads the OKF bundle and the SOW export stores files, so it needs the storage volume (#373).
    environment: { <<: *worker-env, SBAM_QUEUES: sbam-llm, STORAGE_ROOT: /data/storage }
    volumes: [storage:/data/storage]
  worker-build:
    <<: *worker
    # Also runs the run-mirror reconciler every 60 s (one worker is enough; passes are idempotent).
    # The SOW export (SowExport, E6.4) renders on this queue and stores the file, so it needs the storage volume (#404).
    environment:
      {
        <<: *worker-env,
        SBAM_QUEUES: sbam-build,
        SBAM_RECONCILE_EVERY: "60",
        STORAGE_ROOT: /data/storage,
        SCHEMA_CHECK_DSN: postgresql://postgres@schema-check:5432/postgres,
      }
    volumes: [storage:/data/storage]
    # schema-check (E9.4): the SCHEMA_SQL gate's scratch PostgreSQL, reachable from this worker only
    networks: [sbam_internal, sbam_schema_check]
    depends_on:
      <<: *worker-depends
      schema-check: { condition: service_healthy }
  worker-test:
    <<: *worker
    environment: { <<: *worker-env, SBAM_QUEUES: sbam-test }
  worker-certify:
    <<: *worker
    environment: { <<: *worker-env, SBAM_QUEUES: sbam-certify }

  sbam-mock-api:
    # The mock APIs of sandbox tests (E13.5): stubs per run, a request journal, never forwards. Internal
    # network only, no published port; the control surface needs MOCK_CONTROL_TOKEN, which tools under test
    # never get (the worker and the sandbox adapter do).
    image: sbam-mock-api:local
    build:
      context: ..
      dockerfile: compose/docker/mock-api.Dockerfile
    environment:
      MOCK_CONTROL_TOKEN: ${MOCK_CONTROL_TOKEN:?is required - set it in compose/.env (copy compose/.env.example)}
    networks: [sbam_internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    restart: unless-stopped

  sbam-web:
    image: sbam-web:local
    build:
      context: ..
      dockerfile: compose/docker/web.Dockerfile
      target: prod
    environment:
      # Dev role picker; ignored by prod builds, active with the dev target (compose.override.yaml).
      SBAM_DEV_AUTH: ${SBAM_DEV_AUTH:-}
      # Upstream of the /api/proxy route (E1.14); the browser never calls sbam-api directly.
      SBAM_API_URL: http://sbam-api:8000
      # Keycloak sign-in (#51); off while AUTH_SECRET is empty. The issuer is the browser-facing URL (it must
      # match the tokens' iss); the server reaches the same realm at KEYCLOAK_INTERNAL_URL.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: http://localhost:${WEB_PORT:-3000}
      AUTH_TRUST_HOST: "true"
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/bullm
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    networks: [sbam_edge, sbam_internal]
    depends_on:
      sbam-api: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    restart: unless-stopped

networks:
  sbam_edge: {}
  sbam_internal:
    internal: true # no internet route; workers sit only here
  sbam_schema_check:
    internal: true # worker-build <-> schema-check only (E9.4)

volumes:
  pgdata:
  storage:
  cognee_data:
  clamav_db:
