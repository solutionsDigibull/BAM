# Local development mode (TD §20.3.5), loaded by `make up` on laptops: dev image targets with the source
# bind-mounted, so code changes don't need image rebuilds. Dev/staging/prod use compose.<env>.yaml (#142).

x-worker-dev: &worker-dev
  build:
    target: dev
  volumes: [../server:/app/server]

services:
  sbam-api:
    build:
      target: dev # uvicorn --reload on /app/server
    volumes:
      - ../server:/app/server
      - storage:/data/storage
    depends_on:
      api-seed: { condition: service_completed_successfully }

  # The dev tenants behind keycloak-seed's organizations, so their users pass the tenant check (#49).
  api-seed:
    image: sbam-api:local
    build:
      context: ..
      dockerfile: compose/docker/server.Dockerfile
      target: prod
      args: { PACKAGE: sbam-api, ROLE: api }
    command: ["python", "-m", "sbam_api.identity.seed"]
    environment:
      DATABASE_URL: postgresql://sbam:${SBAM_DB_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}@postgres:5432/sbam
    networks: [sbam_internal]
    depends_on:
      api-migrate: { condition: service_completed_successfully }

  # Local seed users and tenants for realm bullm (#47). Laptops/CI only; staging/prod never load this file.
  keycloak-seed:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    environment:
      KC_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?is required - set it in compose/.env (copy compose/.env.example)}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
    volumes: [./keycloak/seed.sh:/seed/seed.sh:ro]
    networks: [sbam_internal]
    depends_on:
      keycloak: { condition: service_healthy }

  sbam-web:
    build:
      target: dev # next dev
    depends_on:
      keycloak-seed: { condition: service_completed_successfully }
    environment:
      WATCHPACK_POLLING: "true" # file events don't cross Docker Desktop bind mounts on Windows
    volumes:
      - ../client:/app/client
      - web_node_modules:/app/client/node_modules
      - web_next:/app/client/.next

  # The bootstrap (#40) runs from the mounted source: `docker compose restart worker-<queue>` after a change.
  # ponytail: no watch mode yet (the TD asks for restart-on-change); follow-up issue.
  worker-ingest: *worker-dev
  worker-knowledge: *worker-dev
  worker-llm: *worker-dev
  worker-build: *worker-dev
  worker-test: *worker-dev
  worker-certify: *worker-dev

volumes:
  web_node_modules:
  web_next:
