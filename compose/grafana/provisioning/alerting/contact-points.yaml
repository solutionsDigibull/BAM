apiVersion: 1

# Operator channel (E16.1). One webhook per environment; the URL comes from the environment, never from Git.
# Grafana expands environment references in provisioning files (a literal dollar sign must be doubled).
contactPoints:
  - orgId: 1
    name: sbam-operators
    receivers:
      - uid: sbam-operators-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${GRAFANA_ALERT_WEBHOOK_URL}
          httpMethod: POST
