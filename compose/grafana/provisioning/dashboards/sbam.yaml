apiVersion: 1

# SBAM dashboards (E16.1). compose.obs.yaml mounts ../../dashboards at the path below; the JSON files are the
# source of truth (read-only in the UI: edit them in Git, not in Grafana).
providers:
  - name: "SBAM"
    orgId: 1
    folder: "SBAM"
    folderUid: sbam
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /otel-lgtm/grafana/conf/provisioning/dashboards/sbam
      foldersFromFilesStructure: false
