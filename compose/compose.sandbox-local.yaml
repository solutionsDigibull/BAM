# SBAM `sandbox-local` profile (TD §20.3, E1.11). Load with `make up PROFILES=sandbox-local`.
# Local-docker sandbox for laptops without the KVM host. It can NEVER certify: runs are recorded as
# LOCAL_DOCKER_NONCERT and the certification checklist rejects them.
# Stub (TD §20.3.6): the runner keeps its final name, network and limits; the adapter that executes tool
# code, maps failures to EGRESS_BLOCKED and writes sandbox_runs.mode lands with #123 (E13.2).
services:
  sandbox-runner:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sh", "-c", "echo 'sandbox-runner stub (#123), mode=$$SANDBOX_MODE' && exec sleep 2147483647"]
    environment:
      SANDBOX_MODE: LOCAL_DOCKER_NONCERT # never CERTIFYING; #123 reads this and certification rejects it
    networks: [sbam_sandbox] # internal; the only peer is sbam-mock-api, no route to the internet
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Merged into the core block: the mock API (tool targets in tests) is the sandbox's only reachable peer.
  sbam-mock-api:
    networks: [sbam_internal, sbam_sandbox]

networks:
  sbam_sandbox:
    internal: true
