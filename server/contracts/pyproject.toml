[project]
name = "sbam-contracts"
version = "0.1.0"
description = "SBAM Pydantic contracts, the single source of truth"
requires-python = "==3.12.*"
dependencies = [
    "email-validator>=2.2",
    "pydantic>=2.12",  # Field(exclude_if=...)
    "rfc8785>=0.1.4",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
