[project]
name = "sbam-server"
version = "0.1.0"
description = "SBAM server workspace: api, workers, contracts"
requires-python = "==3.12.*"
dependencies = ["sbam-api", "sbam-workers", "sbam-contracts"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["api", "workers", "contracts"]

[tool.uv.sources]
sbam-api = { workspace = true }
sbam-workers = { workspace = true }
sbam-contracts = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.13", "black>=25.1", "mypy>=1.18", "pytest>=8.4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api", "workers", "contracts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
