[project]
name = "sbam-server"
version = "0.1.0"
description = "SBAM server workspace: api, workers, contracts"
requires-python = "==3.12.*"
dependencies = ["sbam-api", "sbam-workers", "sbam-contracts"]

[tool.uv]
package = false
# ponytail: pillow 12.x has CRITICAL CVE-2026-112393/112403/112900 (fixed in 13.0.0), but
# cognee -> fastembed caps it below 13. Nothing of ours uses fastembed's image paths (embeddings go
# through Bifrost). Drop this once a fastembed that cognee accepts allows pillow 13 (#273).
override-dependencies = ["pillow>=13.0.0"]

[tool.uv.workspace]
members = ["api", "workers", "contracts"]

[tool.uv.sources]
sbam-api = { workspace = true }
sbam-workers = { workspace = true }
sbam-contracts = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.13",
    "black>=25.1",
    "mypy>=1.18",
    "pytest>=8.4",
    "httpx2>=2.13.1",
    "openpyxl>=3.1.5",
    "types-openpyxl>=3.1.5.20260827",
    "hypothesis>=6.140",
    "jsonschema>=4.25",
    "types-jsonschema>=4.26.0.20261006",
    "moto[s3]>=5.1,<6",
    "types-pyyaml>=6.0.12.20260906",
    "pypdf>=6.21.2",
    "python-docx>=1.2",
    "types-defusedxml>=0.7.0.20260504",
    "types-olefile>=0.47.0.20260508",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "TID251"]
# Queries live only in the db layer, migrations and repositories (TD §7.1, E1.5).
"api/sbam_api/db/**" = ["TID251"]
"api/sbam_api/migrations/**" = ["TID251"]
"**/repository.py" = ["TID251"]
"**/repositories/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.text".msg = "Raw SQL only in sbam_api/db, migrations or a *repository.py (E1.5)"
"sqlalchemy.select".msg = "Query through a TenantScopedRepository subclass (*repository.py)"
"sqlalchemy.insert".msg = "Query through a TenantScopedRepository subclass (*repository.py)"
"sqlalchemy.update".msg = "Query through a TenantScopedRepository subclass (*repository.py)"
"sqlalchemy.delete".msg = "Query through a TenantScopedRepository subclass (*repository.py)"
"sqlalchemy.create_engine".msg = "Use sbam_api.db.session.make_engine"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api", "workers", "contracts", "tests"]

[[tool.mypy.overrides]]
# No type stubs shipped; the S3 stub (#37) wraps them behind StorageBackend.
module = ["boto3", "botocore.*", "moto"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No py.typed: Pandoc and WeasyPrint for the SOW export (#88), python-docx to read it back in tests.
module = ["pypandoc", "weasyprint", "docx", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Cognee ships no py.typed; only knowledge/cognee_backend.py imports it (#78).
module = ["cognee", "cognee.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: needs the Compose stack (`make up`); run with `make test-int`"]
