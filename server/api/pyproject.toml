[project]
name = "sbam-api"
version = "0.1.0"
description = "SBAM FastAPI modular monolith"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sbam-contracts",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
sbam-contracts = { workspace = true }
