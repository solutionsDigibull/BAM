[project]
name = "sbam-api"
version = "0.1.0"
description = "SBAM FastAPI modular monolith"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.16,<2",
    "boto3>=1.40,<2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<1.45",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
    "opentelemetry-instrumentation-httpx>=0.65b0,<0.66",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<0.66",
    "opentelemetry-sdk>=1.44.0,<1.45",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10,<3",
    "sbam-contracts",
    "sqlalchemy>=2.0.54,<2.1",  # OTel sqlalchemy instrumentation supports <2.1 only
    "temporalio[opentelemetry]>=1.33,<1.34",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
sbam-contracts = { workspace = true }
