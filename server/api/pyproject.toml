[project]
name = "sbam-api"
version = "0.1.0"
description = "SBAM FastAPI modular monolith"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.16,<2",
    "boto3>=1.40,<2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jsonschema>=4.25",
    "openpyxl>=3.1.5",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<1.46",
    "opentelemetry-instrumentation-fastapi>=0.66b1,<0.67",
    "opentelemetry-instrumentation-httpx>=0.66b1,<0.67",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1,<0.67",
    "opentelemetry-sdk>=1.45.1,<1.46",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10,<3",
    "python-multipart>=0.0.20",
    "sbam-contracts",
    "sqlalchemy>=2.0.54,<2.1",  # OTel sqlalchemy instrumentation supports <2.1 only
    "sqlglot>=30.23,<31",  # SCHEMA_SQL statement allowlist (E9.4)
    "temporalio[opentelemetry]>=1.35,<1.36",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
sbam-contracts = { workspace = true }
