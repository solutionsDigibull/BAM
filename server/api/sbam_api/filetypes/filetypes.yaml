# Platform configuration for the 43 frozen Filetype master entries (TD §5.2, issue E3.7).
#
# The Filetype tab itself is frozen (O-23): this file holds what SBAM adds on top of it and is never
# written back into the workbook. One entry per row label, validated at API startup
# (sbam_api.filetypes.config): exactly 43, known row labels, known loaders, enabled => loader.
#
#   mvp_enabled    SBAM has an MVP loader for it; only enabled types are accepted for upload
#   loader         loader id (filetypes.config.LOADERS); null for Future types
#   extensions     file extensions WITHOUT the dot ("tar.gz" counts as one); empty when the type is
#                  recognised by content only (OpenAPI, Swagger, FastMCP Spec: detection in E4.4)
#   magic          MIME / magic types for content detection (E4.4)
#   intent_class   the master intent class (Manufacturing Masters v0.2 README section 9)
#   default_route  the master a document of this type lands in by default (a prior only)
#
# Future types (CAD, PCB, media, Google, Web, parquet) stay mvp_enabled: false (no loader yet).

filetypes:
  "Filetype #1":
    mvp_enabled: true
    loader: source-code
    extensions: ["cpp"]
    magic: ["text/x-c++"]
    intent_class: "Agent / tool definition"
    default_route: Agents
  "Filetype #2":
