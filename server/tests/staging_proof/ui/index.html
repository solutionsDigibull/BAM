<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Investor onboarding</title>
<style>
  :root { --blue:#1d4ed8; --blue-soft:#eff4ff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 Inter, system-ui, sans-serif; color:var(--ink); background:#f8fafc; }
  header { padding:14px 20px; background:#fff; border-bottom:1px solid var(--line); font-weight:600; }
  main { display:grid; grid-template-columns:240px 1fr 320px; gap:16px; padding:16px; }
  @media (max-width: 1100px) { main { grid-template-columns:1fr; } }
  section { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  h2 { margin:0 0 10px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .skill { padding:8px 10px; border-radius:8px; margin-bottom:6px; border:1px solid var(--line); }
  .skill.on { background:var(--blue-soft); border-color:var(--blue); color:var(--blue); font-weight:600; }
  .step { display:flex; gap:10px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; }
  .step b { flex:1; }
  .tag { font-size:11px; color:var(--blue); background:var(--blue-soft); padding:2px 8px; border-radius:999px; }
  button { background:var(--blue); color:#fff; border:0; border-radius:8px; padding:7px 14px; font:inherit; cursor:pointer; }
  pre { background:#0b1220; color:#dbe7ff; padding:10px; border-radius:8px; overflow:auto; min-height:120px; margin:0; }
</style>
</head>
<body>
<header>Investor onboarding &middot; Staging</header>
<main>
  <section><h2>Skills</h2>
    <div class="skill on">MS01.1 Investor authentication</div>
    <div class="skill">MS01.2 KYC verification</div>
  </section>
  <section><h2>Steps</h2>
    <div class="step"><span class="tag">automated</span><b>Check the investor's country</b><button data-tool="MS01_1__check">Run</button></div>
    <div class="step"><span class="tag">automated</span><b>Authenticate the investor</b><button data-tool="MS01_1__action">Run</button></div>
    <div class="step"><span class="tag">human</span><b>Review the result</b><span>Checkpoint</span></div>
  </section>
  <section><h2>Output</h2><pre id="out">Press Run: the call goes to this workflow's server.</pre></section>
</main>
<script src="./app.js"></script>
</body>
</html>
