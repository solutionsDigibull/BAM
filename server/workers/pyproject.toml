[project]
name = "sbam-workers"
version = "0.1.0"
description = "SBAM Temporal workers"
requires-python = "==3.12.*"
dependencies = [
    "bandit==1.9.4",
    "black==26.10.1",
    "cognee==1.6.5",
    "cubesandbox==0.7.3",
    "defusedxml>=0.7.1",
    "jinja2>=3.1.6,<4",
    "jsonschema>=4.25",
    "mypy==2.4.0",
    "olefile>=0.47",
    "openpyxl>=3.1.5",
    "packaging>=26.0",
    "pillow>=13",
    "pypandoc-binary>=1.15",
    "pypdf>=6.21.2",
    "pypdfium2>=4",
    "python-docx>=1.2",
    "pyyaml>=6",
    "ruff==0.16.10",
    "sbam-api",
    "sbam-contracts",
    "temporalio[opentelemetry]>=1.35,<1.36",
    "weasyprint>=66",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
sbam-api = { workspace = true }
sbam-contracts = { workspace = true }
