[project]
name = "sbam-workers"
version = "0.1.0"
description = "SBAM Temporal workers"
requires-python = "==3.12.*"
dependencies = [
    "sbam-api",
    "sbam-contracts",
    "temporalio[opentelemetry]>=1.33,<1.34",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
sbam-api = { workspace = true }
sbam-contracts = { workspace = true }
