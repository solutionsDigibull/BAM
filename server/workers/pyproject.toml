[project]
name = "sbam-workers"
version = "0.1.0"
description = "SBAM Temporal workers"
requires-python = "==3.12.*"
dependencies = [
    "black==26.10.0",
    "cognee==1.6.2",
    "jinja2>=3.1.6,<4",
    "jsonschema>=4.25",
    "pypandoc-binary>=1.15",
    "pyyaml>=6",
    "sbam-api",
    "sbam-contracts",
    "temporalio[opentelemetry]>=1.33,<1.34",
    "weasyprint>=66",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
sbam-api = { workspace = true }
sbam-contracts = { workspace = true }
