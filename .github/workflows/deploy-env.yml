# One deploy to one environment (E16.4), called by deploy.yml. The job runs in the GitHub
# environment of that name, so its secrets/vars are that environment's and `production` waits for a
# required reviewer. Secrets: NB_SETUP_KEY, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, SBAM_ALERT_WEBHOOK_URL.
# Vars: NB_MANAGEMENT_URL, DEPLOY_HOST, DEPLOY_USER, SBAM_PROFILES, SMOKE_URLS.
name: deploy-env

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true } # GitHub environment: dev, staging, production
      env-name: { type: string, required: true } # deploy.sh --env: dev, staging, prod
      id: { type: string, required: true }
      sha: { type: string, required: true }

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # pull + migrate + up --wait (5 min) + 5 min watch + a possible rollback
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.sha }}", persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: release-to-deploy, path: release }
      - name: Deploy ${{ inputs.id }}
        env:
          NB_SETUP_KEY: ${{ secrets.NB_SETUP_KEY }}
          NB_MANAGEMENT_URL: ${{ vars.NB_MANAGEMENT_URL }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SBAM_PROFILES: ${{ vars.SBAM_PROFILES }}
          SBAM_ALERT_WEBHOOK_URL: ${{ secrets.SBAM_ALERT_WEBHOOK_URL }}
          SBAM_DEPLOY_ACTOR: ${{ github.triggering_actor }}
          SMOKE_URLS: ${{ vars.SMOKE_URLS }}
          ENV_NAME: ${{ inputs.env-name }}
          RELEASE_ID: ${{ inputs.id }}
        run: bash scripts/ci-deploy.sh "$ENV_NAME" "$RELEASE_ID" release/release.env
