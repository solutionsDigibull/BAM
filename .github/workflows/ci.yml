# CI pipeline (E1.12, TD §20.4). Job names are the required-check names in branch protection:
# lint, types, unit, api, secret-scan, hadolint, image-scan, compose-smoke (+ contract-drift in contracts.yml).
# No path filters: every required check reports on every PR, docs-only ones included.
# compose-smoke is gated (E1.23, scripts/ci-smoke-gate.sh): it runs on every 10th dev merge, on merges that
# touch the stack, on main, nightly and on demand. On PRs it is skipped, and a skipped job passes a required check.
# Third-party actions are pinned by commit SHA; scanners run as digest-pinned images, not actions.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ["v*"]
  schedule:
    - cron: "17 2 * * *" # nightly rebuild + rescan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLM_PROVIDER: mock # no external LLM calls anywhere in CI
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  SYFT_IMAGE: anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  HADOLINT_IMAGE: hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - &setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - &setup-pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.33.2 } # = client/package.json packageManager
      - &setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: make install
      - run: make lint

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - *setup-uv
      - *setup-pnpm
      - *setup-node
      - run: make install
      - run: make typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - *setup-uv
      - *setup-pnpm
      - *setup-node
      - run: make install
      # test_e16_3_deploy.py (#142) resolves compose.deploy.yaml's !reset/!override tags via
      # `docker compose config`; the runner image's bundled compose plugin predates that compose-spec
      # support, so pin a version that has it before those tests run.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade docker-compose-plugin
          docker compose version
      # unit + contract + temporal (workflow replay tests live in tests/temporal)
      - run: cd server && uv run pytest tests/unit tests/contract tests/temporal --junitxml=../reports/server-unit.xml
      - run: pnpm --dir client test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: unit-reports, path: reports/, if-no-files-found: ignore }

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - *setup-uv
      - run: cd server && uv sync --locked
      - run: cd server && uv run pytest tests/api --junitxml=../reports/server-api.xml
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: api-reports, path: reports/, if-no-files-found: ignore }

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      # PRs: only the commits this PR adds; pushes/nightly: the whole history.
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git --redact --no-banner --exit-code 1 ${RANGE:+--log-opts="$RANGE"} .

  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          rc=0
          for f in compose/docker/*.Dockerfile; do
            echo "::group::$f"; docker run --rm -i "$HADOLINT_IMAGE" < "$f" || rc=1; echo "::endgroup::"
          done
          exit $rc

  image-scan:
    name: image-scan (${{ matrix.name }}) # stable required-check names
    needs: [hadolint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # used only by the push steps, which run only on push to main / tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: sbam-api, file: server.Dockerfile, target: prod, args: "PACKAGE=sbam-api\nROLE=api" }
          - { name: sbam-worker, file: server.Dockerfile, target: prod, args: "PACKAGE=sbam-workers\nROLE=worker" }
          - { name: sbam-web, file: web.Dockerfile, target: prod, args: "" }
          - { name: sbam-mock-api, file: mock-api.Dockerfile, target: "", args: "" }
          - { name: skill-runtime, file: skill-runtime.Dockerfile, target: "", args: "" } # #67
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      # Cache scope per branch: a PR reads its base branch's cache but only writes its own scope,
      # so it can't poison dev/main layers.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: compose/docker/${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.args }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ matrix.name }}-${{ github.head_ref || github.ref_name }}
            type=gha,scope=${{ matrix.name }}-${{ github.base_ref || 'dev' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ github.head_ref || github.ref_name }}
      - name: Trivy (fails on fixable CRITICAL)
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" "$TRIVY_IMAGE" \
            image --scanners vuln --format json --output "/reports/trivy-${{ matrix.name }}.json" "$IMAGE:${{ github.sha }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"
      - name: SBOM (SPDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" \
            "$IMAGE:${{ github.sha }}" -o spdx-json > "reports/sbom-${{ matrix.name }}.spdx.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "scan-${{ matrix.name }}", path: reports/, if-no-files-found: ignore }
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push :sha and :main (or the tag)
        if: env.PUSH == 'true'
        env:
          EXTRA_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:$EXTRA_TAG"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:$EXTRA_TAG"
      # Runtime registry (#67): generated INSIDE the image (truth = installed packages), with no network,
      # keyed by the pushed digest (or the local image ID when nothing is pushed). Deploys load it with
      # `python -m sbam_api.registry.sync runtime_registry.json --activate`.
      - name: Runtime registry
        if: matrix.name == 'skill-runtime'
        run: |
          if [ "$PUSH" = true ]; then
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")"
            digest="${digest#*@}"
          else
            digest="$(docker image inspect --format '{{.Id}}' "$IMAGE:${{ github.sha }}")"
          fi
          docker run --rm --network none "$IMAGE:${{ github.sha }}" \
            sbam-runtime-registry --image-digest "$digest" > runtime_registry.json
      - if: matrix.name == 'skill-runtime'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: runtime-registry, path: runtime_registry.json }

  smoke-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 } # the dev merge count needs history
      - id: gate
        run: scripts/ci-smoke-gate.sh "$GITHUB_SHA"
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}

  compose-smoke:
    needs: [smoke-gate]
    if: needs.smoke-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Nightly and manual runs add the Keycloak refresh e2e, which idles past the 300 s access token.
    timeout-minutes: ${{ contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) && 55 || 40 }}
    env:
      ENV_FILE: compose/.env.ci # gitignored via .env.*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - *setup-uv
      - run: cd server && uv sync --locked
      - name: CI env file (random 64-hex secrets, valid even for Langfuse ENCRYPTION_KEY; never committed)
        run: |
          while IFS= read -r line; do
            case "$line" in *=change-me-*) echo "${line%%=*}=$(openssl rand -hex 32)" ;; *) echo "$line" ;; esac
          done < compose/.env.example > "$ENV_FILE"
      # The dev override bind-mounts client/ into sbam-web, which runs as uid 10001; on a Linux runner the
      # checkout belongs to the runner user, so `next dev` can't write next-env.d.ts. Throwaway checkout.
      - name: Make the checkout writable for the dev containers
        run: chmod -R a+rwX client
      # E1.15-T07: block + count container egress to openrouter.ai for the whole job; verified after the tests.
      - name: LLM egress monitor
        run: scripts/ci-llm-egress-guard.sh start
      # Flaky first boot (image pulls, Keycloak import): retry once, then fail.
      - name: make up
        run: make up ENV_FILE="$ENV_FILE" || { echo "::warning::make up failed, retrying once"; make down ENV_FILE="$ENV_FILE"; make up ENV_FILE="$ENV_FILE"; }
      # skill-runtime + runtime registry (#67): build, generate inside the image, sync into the stack DB.
      # SKILL_RUNTIME_IMAGE also enables the in-image PostgreSQL test (E12.1-T05) in make test-int.
      - name: Runtime registry sync
        run: |
          docker build -q -f compose/docker/skill-runtime.Dockerfile -t skill-runtime:ci .
          digest="$(docker image inspect --format '{{.Id}}' skill-runtime:ci)"
          docker run --rm --network none skill-runtime:ci \
            sbam-runtime-registry --image-digest "$digest" > runtime_registry.json
          pw="$(sed -n 's/^SBAM_DB_PASSWORD=//p' "$ENV_FILE")"
          port="$(sed -n 's/^POSTGRES_PORT=//p' "$ENV_FILE")"
          echo "::add-mask::$pw"
          (cd server && DATABASE_URL="postgresql://sbam:$pw@127.0.0.1:${port:-5432}/sbam" \
            uv run python -m sbam_api.registry.sync ../runtime_registry.json --activate)
          echo "SKILL_RUNTIME_IMAGE=skill-runtime:ci" >> "$GITHUB_ENV"
      - name: make test-int
        run: make test-int ENV_FILE="$ENV_FILE"
      - name: No egress to openrouter.ai (E1.15-T07)
        run: scripts/ci-llm-egress-guard.sh verify
        env: { ENV_FILE: compose/.env.ci }
      # Real browser logins through Keycloak against the running stack (#51, E2.5-T01..T08).
      - *setup-pnpm
      - *setup-node
      - name: Keycloak login e2e
        env:
          E2E_SLOW: ${{ contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) && '1' || '' }} # e2_5_t07 idles 5 min
        run: |
          pnpm --dir client install --frozen-lockfile
          pnpm --dir client exec playwright install --with-deps chromium
          seed="$(sed -n 's/^SEED_USER_PASSWORD=//p' "$ENV_FILE")"
          echo "::add-mask::$seed"
          E2E_SEED_PASSWORD="$seed" E2E_BASE_URL=http://localhost:3000 E2E_KEYCLOAK=1             pnpm --dir client exec playwright test --project keycloak
      - if: failure()
        run: |
          docker compose --env-file "$ENV_FILE" -f compose/compose.yaml -f compose/compose.override.yaml ps -a
          docker compose --env-file "$ENV_FILE" -f compose/compose.yaml -f compose/compose.override.yaml logs --tail=200

  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - *setup-pnpm
      - *setup-node
      - run: pnpm --dir client install --frozen-lockfile
      - run: pnpm --dir client exec playwright install --with-deps chromium
      - run: pnpm --dir client e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: client/test-results/, if-no-files-found: ignore }
