# Close the issues a merged PR names with `Closes #N` (#244). GitHub only does this on merges into
# the default branch (main); SBAM merges into dev, so without this every issue stayed open.
#
# pull_request_target: the token may write issues even for PRs from forks. It is safe because no PR
# code runs: the checkout is the base branch (dev, trusted) for scripts/closing_issues.py, and the PR
# body reaches the script only through an environment variable.
name: close-issues

on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # the base branch: never the PR's code
      - name: Close the issues the PR names
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          closed=""
          for n in $(python3 scripts/closing_issues.py); do
            state="$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)"
            if [ "$state" = OPEN ]; then
              gh issue close "$n" -R "$GITHUB_REPOSITORY" --reason completed \
                --comment "Closed by #$PR (merged into \`dev\`)."
              closed="$closed #$n"
            else
              echo "#$n: ${state:-not an issue}, left as is"
            fi
          done
          echo "Closed:${closed:- nothing}" | tee -a "$GITHUB_STEP_SUMMARY"
