# Contract drift (issue E1.2): the generated JSON Schemas and client/src/contracts/index.ts must equal a
# fresh generation from the Pydantic contracts. A hand edit or a forgotten `make contracts` fails here.
name: contracts

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-drift: # required-check name (E1.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.33.2 } # = client/package.json packageManager

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install
        run: make install

      - name: Generated files match the contracts
        run: make contracts-check

      - name: Contract generation tests
        run: cd server && uv run pytest tests/contract/test_contracts_gen.py -v

      - name: Generated TypeScript compiles (strict)
        run: pnpm --dir client typecheck
